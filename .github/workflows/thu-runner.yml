name: Thu runner
on: pull_request
permissions: {}
jobs:
  o-dau:
    runs-on: ${{ vars.RUNNER_AI || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - run: |
          echo "người dùng: $(whoami) · máy: $(hostname) · HOME: $HOME"
          ls -A ~
          ls ~/.claude/skills 2>/dev/null || echo "(không có ~/.claude/skills)"
